name: v1_1d_waveform_scratch
folds: [0, 1, 2, 3, 4]

data:
  train_window_seconds: 20.0
  crops_per_recording_epoch: 2
  batch_size: 32
  eval_batch_size: 16
  num_workers: 4
  augment: true

model:
  name: waveform_mil
  channels: 160
  dropout: 0.25
  topk_pool: 6
  pretrained: false
  init_mode: scratch
  inst_freq_channel: true

optim:
  lr: 0.0012
  weight_decay: 0.015
  epochs: 30
  warmup_epochs: 3
  focal_gamma: 1.5
  pos_weight_scale: 0.35
  auc_loss_weight: 0.40
  subtype_loss_weight: 0.15
  mixup_alpha: 0.20
  early_stopping_patience: 8
  mixed_precision: true
  ssl_epochs: 0

beaker:
  gpus: 1
  shared_memory: 16GiB
  task_timeout: 4h
  task_name: v1_1d_scratch
