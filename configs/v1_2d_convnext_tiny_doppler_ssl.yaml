name: v1_2d_convnext_tiny_doppler_ssl
folds: [0, 1, 2, 3, 4]

data:
  train_window_seconds: 20.0
  crops_per_recording_epoch: 2
  batch_size: 32
  eval_batch_size: 16
  num_workers: 4
  augment: true

model:
  name: spec_tempogram_mil
  channels: 160
  dropout: 0.30
  topk_pool: 6
  pretrained: false
  init_mode: doppler_ssl
  backbone: convnext_tiny.fb_in22k
  n_mels: 96
  decoupled_tempogram: true
  freq_subbands: 4
  temporal_gru: true

optim:
  lr: 0.0008
  backbone_lr_scale: 0.50
  weight_decay: 0.02
  epochs: 28
  warmup_epochs: 4
  focal_gamma: 1.5
  pos_weight_scale: 0.35
  auc_loss_weight: 0.40
  subtype_loss_weight: 0.15
  mixup_alpha: 0.20
  early_stopping_patience: 8
  mixed_precision: true
  ssl_epochs: 15
  ssl_lr: 0.001
  ssl_mask_ratio: 0.60

beaker:
  gpus: 1
  shared_memory: 16GiB
  task_timeout: 4h
  task_name: v1_2d_doppler_ssl
