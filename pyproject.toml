[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heartsounds"
version = "0.2.0"
description = "Modular fetal Doppler ultrasound heart rhythm classification (Normal vs. Abnormal)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "HeartSounds Labs" },
]
dependencies = [
    "google-cloud-storage>=2.18.0",
    "lightgbm>=4.5.0",
    "matplotlib>=3.9.0",
    "numpy>=1.26.4,<3.0.0",
    "pandas>=2.2.2",
    "pyarrow>=17.0.0",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.5.2",
    "scipy>=1.14.0",
    "seaborn>=0.13.2",
    "timm>=1.0.9",
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "tqdm>=4.66.5",
    "xgboost>=2.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/heartsounds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
